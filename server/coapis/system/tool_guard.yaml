# Unified Tool Guard configuration
# global_rules = union of rules/dangerous_shell_commands.yaml + engine extras.
# action semantics: allow / audit / confirm (requires user approval) / block.
version: 1.0.0
description: Unified tool guard configuration — combines command levels, detection rules, and evasion checks
access_control:
  enabled: true
  guarded_tools: []
  denied_tools: []
  custom_rules: []
  disabled_rules: []
commands:
  ls:
    level: L0
    desc: 列出目录内容
    action: allow
    exceptions:
    - &id001
      id: system_paths
      desc: 目标路径为系统/全局目录
      level: L4
      action: block
      patterns:
      - \s/(etc|usr|bin|sbin|lib|lib64|opt|boot|sys|dev|proc|var/run|var/log|var/lib|var/spool)/
      - \s/\.\./
      - \s~\/\.\.
      - ^\s*rm\s+.*\s+/\s*
      exclude_patterns:
      - /\.coapis/workspaces/
      - /\.coapis/agents/
      - /workspaces(/|$)
      - /usr/share/fonts(/|$)
      - /usr/local/share/fonts(/|$)
      - /etc/fonts(/|$)
      - /usr/share/doc(/|$)
      - /usr/share/poppler(/|$)
      - /coapis/agent/skills(/|$)
  cat:
    level: L0
    desc: 查看文件内容
    action: allow
    exceptions:
    - *id001
  head:
    level: L0
    desc: 查看文件头部
    action: allow
    exceptions:
    - *id001
  tail:
    level: L0
    desc: 查看文件尾部
    action: allow
    exceptions:
    - *id001
  grep:
    level: L0
    desc: 文本搜索
    action: allow
    exceptions:
    - *id001
  find:
    level: L0
    desc: 查找文件
    action: allow
    exceptions:
    - *id001
  wc:
    level: L0
    desc: 统计行数/词数
    action: allow
  echo:
    level: L0
    desc: 输出文本
    action: allow
  pwd:
    level: L0
    desc: 显示当前目录
    action: allow
  which:
    level: L0
    desc: 查找命令路径
    action: allow
  whoami:
    level: L0
    desc: 显示当前用户
    action: allow
  date:
    level: L0
    desc: 显示日期时间
    action: allow
  env:
    level: L0
    desc: 显示环境变量
    action: allow
  printenv:
    level: L0
    desc: 打印环境变量
    action: allow
  file:
    level: L0
    desc: 识别文件类型
    action: allow
  stat:
    level: L0
    desc: 显示文件信息
    action: allow
    exceptions:
    - *id001
  diff:
    level: L0
    desc: 比较文件差异
    action: allow
  sort:
    level: L0
    desc: 排序文本行
    action: allow
  uniq:
    level: L0
    desc: 去重文本行
    action: allow
  awk:
    level: L0
    desc: 文本处理
    action: allow
  sed:
    level: L0
    desc: 流编辑器
    action: allow
  strings:
    level: L0
    desc: 查看二进制文件可打印字符串
    action: allow
  mkdir:
    level: L1
    desc: 创建目录
    action: audit
    demotion_rules:
    - &id002
      id: in_workspace
      desc: 仅在自己的 workspace 或临时目录内操作
      level: L0
      action: allow
      scope: workspace
      safe_paths:
      - /tmp
      - /var/tmp
    exceptions:
    - *id001
  touch:
    level: L1
    desc: 创建/更新文件时间戳
    action: audit
    demotion_rules:
    - *id002
    exceptions:
    - *id001
  cp:
    level: L1
    desc: 复制文件
    action: audit
    demotion_rules:
    - *id002
    exceptions:
    - *id001
  mv:
    level: L2
    desc: 移动/重命名文件
    action: confirm
    demotion_rules:
    - *id002
    exceptions:
    - *id001
    - &id008
      id: dangerous_rm
      desc: 危险的递归删除
      level: L4
      action: block
      patterns:
      - \brm\s+.*\s+-[a-zA-Z]*r[a-zA-Z]*\s+(?:/|/\.\*|/\*+|~|~/?\.\*|~/?\*+)
      - \brm\s+.*\s+(?:/|/\.\*|/\*+|~|~/?\.\*|~/?\*+)\s+-[a-zA-Z]*r
  ln:
    level: L1
    desc: 创建链接
    action: audit
    demotion_rules:
    - *id002
    exceptions:
    - *id001
  chmod:
    level: L1
    desc: 修改文件权限
    action: audit
    demotion_rules:
    - *id002
    exceptions:
    - *id001
  chown:
    level: L1
    desc: 修改文件所有者
    action: audit
    demotion_rules:
    - *id002
    exceptions:
    - *id001
  tee:
    level: L1
    desc: 输出到文件和标准输出
    action: audit
    demotion_rules:
    - *id002
    exceptions:
    - *id001
  truncate:
    level: L1
    desc: 截断文件
    action: block
    demotion_rules: []
    exceptions:
    - *id001
  curl:
    level: L2
    desc: HTTP 请求
    action: confirm
    demotion_rules:
    - &id003
      id: in_workspace
      desc: 仅在自己的 workspace 内操作
      level: L0
      action: allow
      scope: workspace
    exceptions:
    - id: network_post
      desc: POST/PUT/DELETE 等写入请求需要确认
      level: L2
      action: confirm
      patterns:
      - \b(curl|wget)\s+.*-X\s+(POST|PUT|DELETE|PATCH)
      - \bcurl\s+.*(--data|--data-raw|--data-binary|--data-urlencode|--form)
    - id: dangerous_output
      desc: 输出到系统目录需要拦截
      level: L4
      action: block
      patterns:
      - \b(curl|wget)\s+.*-o\s+(/etc/|/usr/|/bin/|/sbin/|/lib/|/boot/|/sys/|/dev/|/proc/)
  wget:
    level: L2
    desc: 下载文件
    action: confirm
    demotion_rules:
    - *id003
    exceptions:
    - id: dangerous_output
      desc: 下载到系统目录需要拦截
      level: L4
      action: block
      patterns:
      - \bwget\s+.*-O\s+(/etc/|/usr/|/bin/|/sbin/|/lib/|/boot/|/sys/|/dev/|/proc/)
  git:
    level: L2
    desc: 版本控制
    action: confirm
    demotion_rules:
    - *id003
  python:
    level: L2
    desc: Python 解释器
    action: confirm
    demotion_rules:
    - &id004
      id: id_tmp
      desc: 仅在自己的 workspace 内操作
      level: L0
      action: allow
      scope: workspace
    - &id005
      id: id_tmp_paths
      desc: 仅在临时目录中操作
      level: L0
      action: allow
      safe_paths:
      - /tmp
      - /var/tmp
    - &id005b
      id: builtin_skill_scripts
      desc: 运行内置技能自带脚本（只读、随镜像发布、可信）
      level: L0
      action: allow
      safe_paths:
      - /coapis/agent/skills/
      - /app/coapis/agent/skills/
    exceptions:
    # ── 内联解释器降档（批5B）──────────────────────────────────────────
    # 智能体用 `python3 -c` 生成 pdf/docx、跑自家工作区里的小脚本是日常动作，
    # 此前一律 L3 → 每次都要人工审批（"生成 PDF 为什么要审批"的成因）。
    # 降为 L2 的前提：只碰自家 workspace / 临时目录，且载荷里没有命令替换、
    # 管道进解释器、编码载荷、解释器逃逸原语、敏感路径。
    # L2 = admin 智能模式自动放行，普通用户仍需确认；命中 exclude 的
    # 落回 inline_encoded_payload(L4)/inline_interpreter(L3)，全局规则照旧兜底。
    - &id006a
      id: inline_interpreter_workspace
      desc: 解释器内联执行且仅访问自家 workspace
      level: L2
      action: confirm
      scope: workspace
      patterns: &inline_flags
      - \b(python|python3|node|ruby|perl)\s+(?:[^\s-]*\s)*-(c|e|E|i|I)\b
      - \b(python|python3|node|ruby|perl)\s+(?:[^\s-]*\s)*--(command|eval|execute|interactive)
      exclude_patterns: &inline_hardening
      - \$\(
      - "`"
      - \|\s*(bash|sh|zsh|python3?|node|ruby|perl)\b
      - \bbase64\b
      - \bcurl\b
      - \bwget\b
      - \bnc\b
      - \btelnet\b
      - \bos\.(system|popen|execv|execve|spawn)\b
      - \bsubprocess\b
      - \bexec\s*\(
      - \beval\s*\(
      - __import__
      - \bpty\b
      - shutil\.rmtree
      - \bsocket\b
      - \burllib\b
      - \brequests\b
      - http\.client
      - \bsmtplib\b
      - \bctypes\b
      - \bmultiprocessing\b
      - /(etc|usr|proc|sys|bin|sbin|home|mnt|media|dev|lib)/
      - \.ssh\b
      - \.env\b
      - credential
      - secret
      - password
      - \btoken\b
      - \.pem\b
      - id_rsa
      - auth\.json
      - \brm\s+-[rf]
      - \bmkfs\b
      - \bdd\s+if=
      - \bchmod\b
      - \bchown\b
    - &id006c
      id: inline_interpreter_tmp
      desc: 解释器内联执行且仅访问临时目录
      level: L2
      action: confirm
      safe_paths:
      - /tmp
      - /var/tmp
      patterns: *inline_flags
      exclude_patterns: *inline_hardening
    # L4 必须排在 L3 之前：exceptions 是首条命中即返回，此前 L3 在前，
    # `-c "$(curl …)"` 这类编码/命令替换载荷永远走不到 L4 block。
    - &id006b
      id: inline_encoded_payload
      desc: 内联解释器执行命令替换/编码载荷
      level: L4
      action: block
      patterns:
      - \b(python|python3|node|ruby|perl|bash|sh|zsh)\s+(?:[^\s-]*\s)*-[ce]\s+["']?\$\(|\bbase64\s+(?:-d|--decode)\b.*\|\s*(?:bash|sh|zsh|python3?|node)\b
    - &id006
      id: inline_interpreter
      desc: 解释器内联执行标志
      level: L3
      action: confirm
      patterns:
      - \b(python|python3|node|ruby|perl)\s+(?:[^\s-]*\s)*-(c|e|E|i|I)\b
      - \b(python|python3|node|ruby|perl)\s+(?:[^\s-]*\s)*--(command|eval|execute|interactive)
