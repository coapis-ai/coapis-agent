# Alembic configuration for the unified data layer.
#
# ``sqlalchemy.url`` is set programmatically in ``env.py``
# (``coapis.foundation.db.engine.build_database_url``); the value below is
# only a placeholder so that the ini parses.
#
# ``script_location`` is also overridden programmatically by
# ``coapis.foundation.db.migrate.run_migrations()`` so the package works
# regardless of the current working directory.

[alembic]
script_location = .
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARN
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
