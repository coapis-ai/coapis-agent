[pytest]
# pytest-asyncio 已安装但默认 strict 模式会跳过未标记的 async 测试
# （表现为 "async def functions are not natively supported"）。auto 模式让
# async 测试自动被识别，无需逐个加 @pytest.mark.asyncio。
asyncio_mode = auto

# 两份测试树（server/coapis/tests 与 server/tests）有同名文件，prepend 导入
# 模式会撞 "import file mismatch"；importlib 按文件路径导入，同名不冲突。
importmode = importlib

# 脚本式测试（模块级 sys.exit / import 期打网络）在收集期会崩，故显式排除。
# 这些文件是独立脚本，用 `python3 tests/<file>.py` 直接跑，不走 pytest 收集。
addopts = --ignore=tests/probe_mem_bridge_dev.py
          --ignore=tests/test_chat_verification.py
          --ignore=tests/test_external_auth_mode.py
          --ignore=tests/test_whitelist_matching.py
          --ignore=tests/test_whitelist_standalone.py
          --ignore=tests/test_full_verification.py
          # 一次性容器探针：硬编码 /app 路径 + 引用不存在的 AppFixture。
          --ignore=server/coapis/tests/test_probe_sso.py
          --ignore=server/tests/test_probe_sso.py
