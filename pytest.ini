[pytest]
# pytest-asyncio 已安装但默认 strict 模式会跳过未标记的 async 测试
# （表现为 "async def functions are not natively supported"）。auto 模式让
# async 测试自动被识别，无需逐个加 @pytest.mark.asyncio。
asyncio_mode = auto

# 裸跑 pytest 时只收真正的测试树。scripts/ 与 docker/ 下那些脚本式 test_*.py
# 在 import 期就 sys.exit(1) / 打硬编码端口，会把整轮收集炸成 INTERNALERROR。
# 后端只有一份测试树：server/tests（server/coapis/tests 已于 2026-10-13 并入）。
testpaths = tests server/tests

# 仓库根 tests/ 与 server/tests/ 仍有同名 basename（如 test_agent_eval），
# prepend 导入模式会撞 "import file mismatch"。注意：pytest 9 的 ini 里没有
# `importmode` 这个键（只有 CLI 的 --import-mode），写在 ini 里会被静默忽略并
# 告警，所以必须走 addopts；另一半由测试目录的 __init__.py 解决。
# 另：脚本式测试（模块级 sys.exit / import 期打网络）在收集期会崩，故显式排除，
# 这些文件是独立脚本，用 `python3 tests/<file>.py` 直接跑，不走 pytest 收集。
addopts = --import-mode=importlib
          --ignore=tests/probe_mem_bridge_dev.py
          --ignore=tests/test_chat_verification.py
          --ignore=tests/test_external_auth_mode.py
          --ignore=tests/test_whitelist_matching.py
          --ignore=tests/test_whitelist_standalone.py
          --ignore=tests/test_full_verification.py
