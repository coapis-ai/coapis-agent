name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "client/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "client/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: |
          cd client
          npm ci

      - name: ESLint
        run: |
          cd client
          npm run lint || echo "Lint warnings (non-blocking)"

      - name: TypeScript type check
        run: |
          cd client
          npx tsc --noEmit

      # B0 地基（2026-11-13）：前端契约锁。gate 的是 test:run，覆盖率只出报告不卡门槛
      # —— 前端的真实覆盖率尺子在后端，两处都卡门槛是双重自杀。
      - name: Vitest 契约锁
        run: |
          cd client
          npm run test:run
